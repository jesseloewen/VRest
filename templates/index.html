        async function openVideoDialog(meta, options = {}) {
            const videoSrc = `/api/video/${encodePath(meta.path)}`;
            const subtitleTracks = buildSubtitleTracks(meta);
            const preserveCurrentPlaylist = Boolean(options.preserveCurrentPlaylist);
            state.dialogCurrentPath = String(meta?.path || "");

            syncDialogPlaylist(meta, preserveCurrentPlaylist);
            updateDialogNavButtons();
            setDialogNavControlsVisible(true);
            setPlayerPlaybackState(false);

            const title = fileTitle(meta.name);
            dialogTitleEl.textContent = title;
            fullscreenTitleEl.textContent = title;

            if (plyrPlayer) {
                plyrPlayer.source = {
                    type: "video",
                    sources: [{ src: videoSrc }],
                    tracks: subtitleTracks,
                };
            } else {
                dialogPlayerEl.pause();
                dialogPlayerEl.removeAttribute("src");
                clearNativeTracks();
                applyNativeTracks(subtitleTracks);
                dialogPlayerEl.src = videoSrc;
                dialogPlayerEl.load();
            }

            if (!dialogEl.open) {
                dialogEl.showModal();
            }
            playPlayerImmediately();
            bindScrubPreviewToProgress();
            loadScrubMetadataForVideo(meta.path);
        }

        function closeDialog() {
            stopHoldSpeed();
            clearScrubPreviewState();
            if (plyrPlayer) {
                plyrPlayer.stop();
                plyrPlayer.source = {
                    type: "video",
                    sources: [],
                    tracks: [],
                };
            } else {
                dialogPlayerEl.pause();
                dialogPlayerEl.removeAttribute("src");
                clearNativeTracks();
                dialogPlayerEl.load();
            }
            state.dialogPlaylist = [];
            state.dialogPlaylistIndex = -1;
            state.dialogCurrentPath = "";
            updateDialogNavButtons();
            setDialogNavControlsVisible(true);
            setPlayerPlaybackState(false);
            setPlayerFullscreenMode(false);
            dialogEl.close();
            window.requestAnimationFrame(() => {
                resumeVisiblePreviewsInPreviewMode();
            });
        }

        function encodePath(path) {
            return path
                .split("/")
                .map((part) => encodeURIComponent(part))
                .join("/");
        }

        function subtitleTrackUrl(videoPath, trackId) {
            return `/api/subtitle/${encodePath(videoPath)}/${encodeURIComponent(trackId)}.vtt`;
        }

        function buildSubtitleTracks(meta) {
            const subtitles = Array.isArray(meta.subtitles) ? meta.subtitles : [];
            return subtitles.map((track, index) => {
                const lang = (track.lang || "und").toLowerCase();
                const isEnglish = lang === "en" || lang.startsWith("en-") ||
                    String(track.label || "").toLowerCase().includes("english");

                return {
                    kind: "subtitles",
                    src: subtitleTrackUrl(meta.path, track.id),
                    srclang: lang,
                    label: track.label || track.lang || `Subtitle ${index + 1}`,
                    default: Boolean(track.default || (index === 0 && isEnglish)),
                };
            });
        }

        function clearNativeTracks() {
            dialogPlayerEl.querySelectorAll("track").forEach((node) => node.remove());
        }

        function applyNativeTracks(tracks) {
            tracks.forEach((track) => {
                const node = document.createElement("track");
                node.kind = track.kind || "subtitles";
                node.src = track.src;
                node.srclang = track.srclang || "und";
                node.label = track.label || track.srclang || "Subtitle";
                if (track.default) {
                    node.default = true;
                }
                dialogPlayerEl.appendChild(node);
            });
        }

        function folderLabel(path) {
            if (!path) {
                return "Root";
            }
            const parts = path.split("/");
            return parts[parts.length - 1] || "Root";
        }

        function fileTitle(name) {
            return name.replace(/\.[^/.]+$/, "");
        }

        function collectFolderPaths(node, bucket = new Set()) {
            if (!node) {
                return bucket;
            }

            bucket.add(String(node.path || ""));

            const childFolders = Array.isArray(node.folders) ? node.folders : [];
            for (const child of childFolders) {
                collectFolderPaths(child, bucket);
            }

            return bucket;
        }

        function formatDuration(seconds) {
            const total = Number(seconds);
            if (!Number.isFinite(total) || total <= 0) {
                return "--:--";
            }

            const wholeSeconds = Math.floor(total);
            const hours = Math.floor(wholeSeconds / 3600);
            const minutes = Math.floor((wholeSeconds % 3600) / 60);
            const secs = wholeSeconds % 60;

            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
            }
            return `${minutes}:${String(secs).padStart(2, "0")}`;
        }

        function getPlayableDuration() {
            if (
                plyrPlayer &&
                Number.isFinite(Number(plyrPlayer.duration)) &&
                Number(plyrPlayer.duration) > 0
            ) {
                return Number(plyrPlayer.duration);
            }
            const nativeDuration = Number(dialogPlayerEl.duration || 0);
            return Number.isFinite(nativeDuration) && nativeDuration > 0 ? nativeDuration : 0;
        }

        function hideScrubPreview() {
            scrubPreviewEl.classList.remove("visible");
        }

        function clearScrubBindings() {
            if (!state.scrubProgressEl || !state.scrubListeners) {
                return;
            }
            state.scrubProgressEl.removeEventListener("mousemove", state.scrubListeners.mousemove);
            state.scrubProgressEl.removeEventListener("mouseleave", state.scrubListeners.mouseleave);
            state.scrubProgressEl.removeEventListener("touchmove", state.scrubListeners.touchmove);
            state.scrubProgressEl.removeEventListener("touchend", state.scrubListeners.touchend);
            state.scrubProgressEl = null;
            state.scrubListeners = null;
        }

        function setScrubPreviewPosition(clientX) {
            const shellRect = playerShellEl.getBoundingClientRect();
            if (!shellRect.width) {
                return;
            }
            const localX = clientX - shellRect.left;
            scrubPreviewEl.style.left = `${localX}px`;
        }

        function frameForTime(metadata, seconds) {
            const frames = Array.isArray(metadata?.frames) ? metadata.frames : [];
            if (!frames.length) {
                return null;
            }
            const interval = Math.max(1, Number(metadata.intervalSeconds || 10));
            const idx = Math.max(0, Math.min(frames.length - 1, Math.floor(seconds / interval)));
            return frames[idx] || null;
        }

        function spriteUrl(videoPath, sheetIndex) {
            return `/api/scrub/${encodePath(videoPath)}/sprite/${sheetIndex}.jpg`;
        }

        function updateScrubPreviewFromClientX(clientX) {
            const progressEl = state.scrubProgressEl;
            if (!progressEl || !state.scrubMetadata) {
                hideScrubPreview();
                return;
            }

            const progressRect = progressEl.getBoundingClientRect();
            if (!progressRect.width) {
                hideScrubPreview();
                return;
            }

            const ratio = Math.max(0, Math.min(1, (clientX - progressRect.left) / progressRect.width));
            const duration = getPlayableDuration() || Number(state.scrubMetadata.durationSeconds || 0);
            const timeAtCursor = ratio * Math.max(duration, 0);
            const frame = frameForTime(state.scrubMetadata, timeAtCursor);
            if (!frame) {
                hideScrubPreview();
                return;
            }

            const tile = state.scrubMetadata.tile || {};
            const cellW = Number(frame.w || tile.cellWidth || 160);
            const cellH = Number(frame.h || tile.cellHeight || 90);
            const cols = Number(tile.columns || 10);
            const rows = Number(tile.rows || 10);

            scrubPreviewImageEl.style.backgroundImage = `url('${spriteUrl(state.scrubVideoPath, frame.sheet)}')`;
            scrubPreviewImageEl.style.width = `${cellW}px`;
            scrubPreviewImageEl.style.height = `${cellH}px`;
            scrubPreviewImageEl.style.backgroundPosition = `-${frame.x}px -${frame.y}px`;
            scrubPreviewImageEl.style.backgroundSize = `${cols * cellW}px ${rows * cellH}px`;
            scrubPreviewTimeEl.textContent = formatDuration(timeAtCursor);
            setScrubPreviewPosition(clientX);
            scrubPreviewEl.classList.add("visible");
        }

        function bindScrubPreviewToProgress() {
            clearScrubBindings();
            const progressEl = playerShellEl.querySelector(".plyr__progress");
            if (!progressEl) {
                return;
            }

            const handlers = {
                mousemove: (event) => {
                    updateScrubPreviewFromClientX(event.clientX);
                },
                mouseleave: () => {
                    hideScrubPreview();
                },
                touchmove: (event) => {
                    if (!event.touches || !event.touches.length) {
                        return;
                    }
                    updateScrubPreviewFromClientX(event.touches[0].clientX);
                },
                touchend: () => {
                    hideScrubPreview();
                },
            };

            progressEl.addEventListener("mousemove", handlers.mousemove);
            progressEl.addEventListener("mouseleave", handlers.mouseleave);
            progressEl.addEventListener("touchmove", handlers.touchmove, { passive: true });
            progressEl.addEventListener("touchend", handlers.touchend, { passive: true });

            state.scrubProgressEl = progressEl;
            state.scrubListeners = handlers;
        }

        async function loadScrubMetadataForVideo(videoPath) {
            state.scrubVideoPath = videoPath;
            state.scrubMetadata = null;
            hideScrubPreview();

            try {
                const response = await fetch(`/api/scrub/${encodePath(videoPath)}/metadata`, { cache: "no-store" });
                if (!response.ok) {
                    return;
                }
                const payload = await response.json();
                if (state.scrubVideoPath !== videoPath) {
                    return;
                }
                state.scrubMetadata = payload;
                bindScrubPreviewToProgress();
            } catch (_) {
                // Ignore scrub preview failures and keep playback functional.
            }
        }

        function clearScrubPreviewState() {
            state.scrubMetadata = null;
            state.scrubVideoPath = "";
            hideScrubPreview();
            clearScrubBindings();
        }

        async function triggerBulkGeneration(kind) {
            if (state.generationActionInFlight) {
                return;
            }

            if (kind !== "preview" && kind !== "scrub") {
                return;
            }

            state.generationActionInFlight = true;
            generateAllPreviewsBtn.disabled = true;
            generateAllScrubBtn.disabled = true;
            cleanDataFolderBtn.disabled = true;
            const label = kind === "preview" ? "preview" : "scrub";
            try {
                const response = await fetch(`/api/${kind}/pregenerate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                });
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.error || `Failed to start ${label} generation`);
                }

                const started = Boolean(payload.started);
                generationMetaEl.textContent = started
                    ? `Started bulk ${label} generation...`
                    : `Bulk ${label} generation is already running.`;
                loadGenerationStatuses();
            } catch (_) {
                generationMetaEl.textContent = `Could not start bulk ${label} generation.`;
            } finally {
                state.generationActionInFlight = false;
                generateAllPreviewsBtn.disabled = false;
                generateAllScrubBtn.disabled = false;
                cleanDataFolderBtn.disabled = state.cleanupRequestInFlight;
            }
        }

        async function triggerDataCleanup() {
            if (state.cleanupRequestInFlight || state.generationActionInFlight) {
                return;
            }

            const shouldClean = window.confirm(
                "Remove cached data files for videos that no longer exist in your library?"
            );
            if (!shouldClean) {
                return;
            }

            state.cleanupRequestInFlight = true;
            cleanDataFolderBtn.disabled = true;
            cleanDataFolderBtn.textContent = "Cleaning Data Folder...";
            generationMetaEl.textContent = "Cleaning orphaned cache data...";

            try {
                const response = await fetch("/api/data/cleanup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                });
                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || "Failed to clean data folder");
                }

                generationMetaEl.textContent =
                    `Cleanup complete: removed ${Number(payload.filesDeleted || 0)} files and ` +
                    `${Number(payload.directoriesDeleted || 0)} folders.`;
                await loadLibrary();
                await loadGenerationStatuses();
            } catch (error) {
                generationMetaEl.textContent = `Data cleanup failed: ${error.message}`;
            } finally {
                state.cleanupRequestInFlight = false;
                cleanDataFolderBtn.disabled = false;
                cleanDataFolderBtn.textContent = "Clean Data Folder";
            }
        }

        async function triggerReindex() {
            if (state.reindexRequestInFlight) {
                return;
            }

            state.reindexRequestInFlight = true;
            reindexBtnEl.disabled = true;
            reindexBtnEl.textContent = "Starting...";

            try {
                const response = await fetch("/api/reindex", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                });
                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || "Failed to start indexing");
                }

                if (payload.started) {
                    statusText.textContent = "Indexing started...";
                } else if (payload.indexing) {
                    statusText.textContent = "Indexing already running...";
                } else {
                    statusText.textContent = "Indexing request queued";
                }

                loadLibrary();
            } catch (error) {
                statusText.textContent = `Could not start indexing: ${error.message}`;
            } finally {
                state.reindexRequestInFlight = false;
                reindexBtnEl.disabled = false;
                reindexBtnEl.textContent = "Re-Index";
            }
        }

        function inCurrentFilter(video) {
            if (!state.folderFilter) {
                return true;
            }
            return (
                video.folder === state.folderFilter ||
                video.folder.startsWith(state.folderFilter + "/")
            );
        }

        function matchesSearch(video) {
            const query = (state.searchQuery || "").trim().toLowerCase();
            if (!query) {
                return true;
            }

            const searchTerms = query
                .split(",")
                .map((term) => term.trim())
                .filter(Boolean);
            if (!searchTerms.length) {
                return true;
            }

            const haystacks = [
                String(fileTitle(video.name || "")).toLowerCase(),
                String(video.name || "").toLowerCase(),
                String(video.folder || "").toLowerCase(),
                String(video.path || "").toLowerCase(),
            ];

            return searchTerms.some((term) =>
                haystacks.some((value) => value.includes(term))
            );
        }

        function videoSortIdentity(video) {
            return String(video.path || `${video.folder || ""}/${video.name || ""}`);
        }

        function ensureRandomSortTokens() {
            const liveKeys = new Set();
            state.videos.forEach((video) => {
                const key = videoSortIdentity(video);
                liveKeys.add(key);
                if (!state.randomSortTokens.has(key)) {
                    state.randomSortTokens.set(key, Math.random());
                }
            });

            Array.from(state.randomSortTokens.keys()).forEach((key) => {
                if (!liveKeys.has(key)) {
                    state.randomSortTokens.delete(key);
                }
            });
        }

        function rerandomizeVideos() {
            state.randomSortTokens.clear();
            ensureRandomSortTokens();
        }

        function compareVideos(a, b) {
            if (state.sortKey === "az") {
                const byName = String(fileTitle(a.name || "")).localeCompare(
                    String(fileTitle(b.name || "")),
                    undefined,
                    { sensitivity: "base", numeric: true }
                );
                if (byName !== 0) {
                    return byName;
                }
                return String(a.path || "").localeCompare(String(b.path || ""), undefined, {
                    sensitivity: "base",
                    numeric: true,
                });
            }

            if (state.sortKey === "dateAdded") {
                const aTs = Number(a.dateAddedTs || 0);
                const bTs = Number(b.dateAddedTs || 0);
                if (aTs !== bTs) {
                    return aTs - bTs;
                }
                return String(a.path || "").localeCompare(String(b.path || ""), undefined, {
                    sensitivity: "base",
                    numeric: true,
                });
            }

            if (state.sortKey === "length") {
                const aDuration = Number(a.durationSeconds || 0);
                const bDuration = Number(b.durationSeconds || 0);
                if (aDuration !== bDuration) {
                    return aDuration - bDuration;
                }
                return String(a.path || "").localeCompare(String(b.path || ""), undefined, {
                    sensitivity: "base",
                    numeric: true,
                });
            }

            if (state.sortKey === "size") {
                const aSize = Number(a.fileSizeBytes || 0);
                const bSize = Number(b.fileSizeBytes || 0);
                if (aSize !== bSize) {
                    return aSize - bSize;
                }
                return String(a.path || "").localeCompare(String(b.path || ""), undefined, {
                    sensitivity: "base",
                    numeric: true,
                });
            }

            if (state.sortKey === "random") {
                ensureRandomSortTokens();
                const aKey = videoSortIdentity(a);
                const bKey = videoSortIdentity(b);
                const aRank = Number(state.randomSortTokens.get(aKey) || 0);
                const bRank = Number(state.randomSortTokens.get(bKey) || 0);
                if (aRank !== bRank) {
                    return aRank - bRank;
                }
                return String(a.path || "").localeCompare(String(b.path || ""), undefined, {
                    sensitivity: "base",
                    numeric: true,
                });
            }

            return 0;
        }

        function getVisibleVideos() {
            const scoped = state.videos.filter((video) => inCurrentFilter(video) && matchesSearch(video));

            if (state.sortKey === "default") {
                if (state.sortDirection < 0) {
                    scoped.reverse();
                }
                return scoped;
            }

            if (state.sortKey === "random") {
                return scoped.sort((a, b) => compareVideos(a, b));
            }

            return scoped.sort((a, b) => compareVideos(a, b) * state.sortDirection);
        }

        function defaultSortDirection(sortKey) {
            return sortKey === "dateAdded" || sortKey === "length" || sortKey === "size" ? -1 : 1;
        }

        function updateSearchClearButton() {
            const hasQuery = Boolean(searchInputEl.value);
            clearSearchBtnEl.hidden = !hasQuery;
            clearSearchBtnEl.disabled = !hasQuery;
            clearSearchBtnEl.setAttribute("aria-hidden", hasQuery ? "false" : "true");
        }

        function saveSortPreferences() {
            try {
                window.localStorage.setItem(SORT_KEY_STORAGE_KEY, state.sortKey);
                if (state.sortKey === "random") {
                    window.localStorage.removeItem(SORT_DIR_STORAGE_KEY);
                } else {
                    const normalizedDirection = state.sortDirection >= 0 ? 1 : -1;
                    window.localStorage.setItem(SORT_DIR_STORAGE_KEY, String(normalizedDirection));
                }
            } catch (error) {
                // Ignore storage errors (privacy mode, blocked storage, etc.)
            }
        }

        function loadSortPreferences() {
            let savedSortKey = null;
            let savedSortDirection = null;

            try {
                savedSortKey = window.localStorage.getItem(SORT_KEY_STORAGE_KEY);
                savedSortDirection = window.localStorage.getItem(SORT_DIR_STORAGE_KEY);
            } catch (error) {
                // Ignore storage errors and keep defaults.
            }

            if (savedSortKey && SORT_KEYS.has(savedSortKey)) {
                state.sortKey = savedSortKey;
            } else {
                state.sortKey = "random";
            }

            if (state.sortKey === "random") {
                state.sortDirection = 1;
                // Ensure fresh random ordering when random is the saved mode.
                rerandomizeVideos();
            } else {
                const parsedDirection = Number(savedSortDirection);
                if (parsedDirection === 1 || parsedDirection === -1) {
                    state.sortDirection = parsedDirection;
                } else {
                    state.sortDirection = defaultSortDirection(state.sortKey);
                }
            }

            sortSelectEl.value = state.sortKey;
        }

        function applyItemSize(itemSizeKey) {
            const normalized = ITEM_SIZE_KEYS.has(itemSizeKey) ? itemSizeKey : "sm";
            const sizePx = ITEM_SIZE_PRESETS[normalized];
            state.itemSizeKey = normalized;
            document.documentElement.style.setProperty("--grid-min", `${sizePx}px`);
            itemSizeSelectEl.value = normalized;
            applyMobileGridColumns(normalized);
        }

        function mobileGridColumnsForSize(itemSizeKey) {
            if (itemSizeKey === "lg") {
                return 1;
            }
            if (itemSizeKey === "md") {
                return 2;
            }
            if (itemSizeKey === "sm") {
                return 3;
            }
            return 4;
        }

        function applyMobileGridColumns(itemSizeKey) {
            if (!state.isMobile) {
                document.documentElement.style.removeProperty("--mobile-grid-columns");
                return;
            }
            const columns = mobileGridColumnsForSize(itemSizeKey);
            document.documentElement.style.setProperty("--mobile-grid-columns", String(columns));
        }

        function itemSizeStorageKeyForViewport() {
            return state.isMobile ? ITEM_SIZE_MOBILE_STORAGE_KEY : ITEM_SIZE_STORAGE_KEY;
        }

        function defaultItemSizeForViewport() {
            return state.isMobile ? "lg" : "sm";
        }

        function saveItemSizePreference() {
            try {
                window.localStorage.setItem(itemSizeStorageKeyForViewport(), state.itemSizeKey);
            } catch (error) {
                // Ignore storage errors (privacy mode, blocked storage, etc.)
            }
        }

        function loadItemSizePreference() {
            let savedItemSize = null;

            try {
                savedItemSize = window.localStorage.getItem(itemSizeStorageKeyForViewport());
            } catch (error) {
                // Ignore storage errors and keep defaults.
            }

            applyItemSize(savedItemSize || defaultItemSizeForViewport());
        }

        function updateSortDirectionButton() {
            const isRandom = state.sortKey === "random";
            sortDirBtnEl.hidden = isRandom;
            sortDirBtnEl.disabled = isRandom;
            sortDirBtnEl.setAttribute("aria-hidden", isRandom ? "true" : "false");
            rerandomizeBtnEl.hidden = !isRandom;
            rerandomizeBtnEl.disabled = !isRandom;
            rerandomizeBtnEl.setAttribute("aria-hidden", isRandom ? "false" : "true");

            if (isRandom) {
                rerandomizeBtnEl.title = "Re-randomize video order";
                return;
            }

            const ascending = state.sortDirection >= 0;
            sortDirBtnEl.textContent = ascending ? "↑" : "↓";
            sortDirBtnEl.title = ascending
                ? "Ascending order (click to reverse)"
                : "Descending order (click to reverse)";
        }

        function buildBreadcrumbs() {
            breadcrumbsEl.innerHTML = "";

            const rootCrumb = document.createElement("button");
            rootCrumb.className = "crumb";
            rootCrumb.textContent = "All Videos";
            rootCrumb.addEventListener("click", () => {
                state.folderFilter = "";
                renderFolders();
                renderGrid();
            });
            breadcrumbsEl.appendChild(rootCrumb);

            if (!state.folderFilter) {
                return;
            }

            const parts = state.folderFilter.split("/");
            let cumulative = "";
            for (const part of parts) {
                cumulative = cumulative ? cumulative + "/" + part : part;
                const crumb = document.createElement("button");
                crumb.className = "crumb";
                crumb.textContent = part;
                const target = cumulative;
                crumb.addEventListener("click", () => {
                    state.folderFilter = target;
                    renderFolders();
                    renderGrid();
                });
                breadcrumbsEl.appendChild(crumb);
            }
        }

        function renderFolderNode(node) {
            const li = document.createElement("li");
            li.className = "tree-item";

            const row = document.createElement("div");
            row.className = "tree-row";

            const hasChildren = node.folders && node.folders.length > 0;
            const isExpanded = state.expandedFolders.has(node.path);

            if (hasChildren) {
                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "tree-toggle";
                toggle.textContent = isExpanded ? "▾" : "▸";
                toggle.setAttribute("aria-label", isExpanded ? "Collapse folder" : "Expand folder");
                toggle.addEventListener("click", (event) => {
                    event.stopPropagation();
                    if (state.expandedFolders.has(node.path)) {
                        state.expandedFolders.delete(node.path);
                    } else {
                        state.expandedFolders.add(node.path);
                    }
                    renderFolders();
                });
                row.appendChild(toggle);
            } else {
                const spacer = document.createElement("span");
                spacer.className = "tree-spacer";
                row.appendChild(spacer);
            }

            const button = document.createElement("button");
            button.type = "button";
            button.className = "tree-button" + (state.folderFilter === node.path ? " active" : "");
            button.innerHTML = `<span class="tree-name">${node.path ? "📁 " + node.name : "🏠 Root"}</span>`;
            button.addEventListener("click", () => {
                state.folderFilter = node.path;
                if (node.path) {
                    const segments = node.path.split("/");
                    let chain = "";
                    for (const segment of segments) {
                        chain = chain ? `${chain}/${segment}` : segment;
                        state.expandedFolders.add(chain);
                    }
                }
                renderFolders();
                renderGrid();
                closeSidebarIfMobile();
            });
            row.appendChild(button);
            li.appendChild(row);

            if (hasChildren && isExpanded) {
                const children = document.createElement("ul");
                children.className = "tree-children";
                for (const child of node.folders) {
                    children.appendChild(renderFolderNode(child));
                }
                li.appendChild(children);
            }

            return li;
        }

        function renderFolders() {
            folderTreeEl.innerHTML = "";
            if (!state.root) {
                return;
            }
            folderTreeEl.appendChild(renderFolderNode(state.root));
            buildBreadcrumbs();
        }

        function buildObserver() {
            if (state.observer) {
                state.observer.disconnect();
            }

            state.observer = new IntersectionObserver(
                (entries) => {
                    for (const entry of entries) {
                        if (!entry.isIntersecting) {
                            continue;
                        }
                        const card = entry.target;
                        const img = card.querySelector("img.card-thumb");
                        if (img && img.dataset.src && !img.src) {
                            img.src = img.dataset.src;
                        }
                        state.observer.unobserve(card);
                    }
                },
                {
                    root: null,
                    rootMargin: "180px",
                    threshold: 0.1,
                }
            );
        }

        function buildPreviewObserver() {
            if (state.previewObserver) {
                state.previewObserver.disconnect();
            }

            state.previewObserver = new IntersectionObserver(
                (entries) => {
                    for (const entry of entries) {
                        const card = entry.target;
                        const inView = entry.isIntersecting && entry.intersectionRatio >= 0.2;
                        card.dataset.previewInView = inView ? "true" : "false";

                        if (!state.previewModeEnabled) {
                            continue;
                        }

                        const meta = state.cardMeta.get(card);
                        if (!meta) {
                            continue;
                        }

                        if (inView) {
                            activatePreview(card, meta);
                        } else {
                            card.dataset.previewActive = "false";
                            card.dataset.previewToken = "";
                            clearPreview(card);
                        }
                    }
                },
                {
                    root: null,
                    rootMargin: "120px",
                    threshold: [0, 0.2, 0.5],
                }
            );
        }

        function setPreviewModeEnabled(enabled) {
            state.previewModeEnabled = Boolean(enabled);
            previewModeToggleEl.checked = state.previewModeEnabled;

            if (!state.previewModeEnabled) {
                clearAllPreviews();
                return;
            }

            state.cards.forEach((card) => {
                if (card.dataset.previewInView !== "true") {
                    return;
                }
                const meta = state.cardMeta.get(card);
                if (meta) {
                    activatePreview(card, meta);
                }
            });
        }

        function savePreviewModePreference() {
            try {
                window.localStorage.setItem(
                    PREVIEW_MODE_STORAGE_KEY,
                    state.previewModeEnabled ? "true" : "false"
                );
            } catch (error) {
                // Ignore storage errors (privacy mode, blocked storage, etc.)
            }
        }

        function loadPreviewModePreference() {
            let savedPreviewMode = null;

            try {
                savedPreviewMode = window.localStorage.getItem(PREVIEW_MODE_STORAGE_KEY);
            } catch (error) {
                // Ignore storage errors and keep defaults.
            }

            setPreviewModeEnabled(savedPreviewMode === "true");
        }

        function clearPreview(card) {
            const preview = card.querySelector("video.card-preview");
            card.classList.remove("previewing", "preview-loading", "preview-error");
            preview.pause();
            preview.removeAttribute("src");
            preview.load();
        }

        function clearThumbnailRetry(card) {
            const timerId = state.thumbnailRetryTimers.get(card);
            if (timerId) {
                window.clearTimeout(timerId);
                state.thumbnailRetryTimers.delete(card);
            }
        }

        function scheduleThumbnailRetry(card, img, thumbSrc, attempt) {
            clearThumbnailRetry(card);

            if (!card.isConnected) {
                return;
            }

            if (attempt >= THUMBNAIL_MAX_RETRIES) {
                img.src = FALLBACK_THUMB;
                card.classList.remove("skeleton");
                return;
            }

            const delayMs = THUMBNAIL_RETRY_BASE_MS + attempt * 300;
            const timerId = window.setTimeout(() => {
                if (!card.isConnected) {
                    clearThumbnailRetry(card);
                    return;
                }
                const cacheBuster = `cb=${Date.now()}-${attempt + 1}`;
                img.src = `${thumbSrc}?${cacheBuster}`;
            }, delayMs);

            state.thumbnailRetryTimers.set(card, timerId);
        }

        function clearAllPreviews(exceptCard) {
            state.cards.forEach((candidate) => {
                if (candidate === exceptCard) {
                    return;
                }
                candidate.dataset.previewActive = "false";
                candidate.dataset.previewToken = "";
                clearPreview(candidate);
            });
        }

        function resumeVisiblePreviewsInPreviewMode() {
            if (!state.previewModeEnabled) {
                return;
            }

            state.cards.forEach((card) => {
                if (card.dataset.previewInView !== "true") {
                    return;
                }
                const meta = state.cardMeta.get(card);
                if (!meta) {
                    return;
                }
                activatePreview(card, meta);
            });
        }

        async function activatePreview(card, meta) {
            const preview = card.querySelector("video.card-preview");
            if (card.dataset.previewActive === "true") {
                return;
            }
            const hoverToken =
                typeof crypto !== "undefined" && crypto.randomUUID
                    ? crypto.randomUUID()
                    : `${Date.now()}-${Math.random()}`;
            card.dataset.previewActive = "true";
            card.dataset.previewToken = hoverToken;

            card.classList.remove("preview-error");
            card.classList.add("preview-loading");

            preview.src = `/api/preview/${encodePath(meta.path)}`;

            try {
                await preview.play();
                if (
                    card.dataset.previewActive !== "true" ||
                    card.dataset.previewToken !== hoverToken
                ) {
                    return;
                }
                card.classList.add("previewing");
            } catch (_) {
                if (
                    card.dataset.previewActive !== "true" ||
                    card.dataset.previewToken !== hoverToken
                ) {
                    return;
                }
                card.classList.add("preview-error");
            } finally {
                if (card.dataset.previewToken === hoverToken) {
                    card.classList.remove("preview-loading");
                }
            }
        }

        function renderCard(meta, idx) {
            const card = document.createElement("article");
            card.className = "video-card skeleton";
            card.style.animation = `appear 360ms ease ${Math.min(idx * 25, 250)}ms both`;

            const thumbSrc = `/api/thumbnail/${encodePath(meta.path)}`;
            const durationLabel = formatDuration(meta.durationSeconds);

            card.innerHTML = `
                <div class="card-media">
                    <img class="card-thumb" alt="${meta.name}" data-src="${thumbSrc}" loading="lazy" />
                    <video class="card-preview" muted loop playsinline preload="none"></video>
                    <div class="preview-loader">Generating preview...</div>
                    <div class="preview-error">Preview failed</div>
                </div>
                <div class="card-body">
                    <h4 class="card-title">${fileTitle(meta.name)}</h4>
                    <div class="card-meta">
                        <span class="folder-pill">${folderLabel(meta.folder)}</span>
                        <span class="duration-pill">${durationLabel}</span>
                    </div>
                </div>
            `;

            const img = card.querySelector("img.card-thumb");
            img.dataset.thumbSrc = thumbSrc;
            img.dataset.thumbAttempt = "0";
            img.addEventListener("load", () => {
                clearThumbnailRetry(card);
                card.classList.remove("skeleton");
            });
            img.addEventListener("error", () => {
                const baseThumbSrc = img.dataset.thumbSrc || thumbSrc;
                const attempt = Number.parseInt(img.dataset.thumbAttempt || "0", 10) || 0;
                img.dataset.thumbAttempt = String(attempt + 1);
                scheduleThumbnailRetry(card, img, baseThumbSrc, attempt);
            });

            if (!isTouchLike()) {
                card.addEventListener("mouseenter", () => {
                    if (state.previewModeEnabled) {
                        activatePreview(card, meta);
                        return;
                    }
                    clearAllPreviews(card);
                    activatePreview(card, meta);
                });
                card.addEventListener("mouseleave", () => {
                    if (state.previewModeEnabled && card.dataset.previewInView === "true") {
                        return;
                    }
                    card.dataset.previewActive = "false";
                    card.dataset.previewToken = "";
                    clearPreview(card);
                });
            }

            if (isTouchLike()) {
                let holdTimer = null;
                let holdPointerId = null;
                let holdStartX = 0;
                let holdStartY = 0;
                let holdActivated = false;

                const clearHoldTimer = () => {
                    if (holdTimer) {
                        window.clearTimeout(holdTimer);
                        holdTimer = null;
                    }
                };

                const stopHeldPreview = () => {
                    card.dataset.previewActive = "false";
                    card.dataset.previewToken = "";
                    clearPreview(card);
                };

                const beginHold = (event) => {
                    if (event.pointerType === "mouse") {
                        return;
                    }
                    clearHoldTimer();
                    holdActivated = false;
                    holdPointerId = event.pointerId ?? null;
                    holdStartX = Number(event.clientX || 0);
                    holdStartY = Number(event.clientY || 0);
                    holdTimer = window.setTimeout(() => {
                        holdActivated = true;
                        if (!state.previewModeEnabled) {
                            clearAllPreviews(card);
                        }
                        activatePreview(card, meta);
                    }, PREVIEW_HOLD_DELAY_MS);
                };

                const moveHold = (event) => {
                    if (holdPointerId !== null && event.pointerId !== holdPointerId) {
                        return;
                    }
                    const dx = Math.abs(Number(event.clientX || 0) - holdStartX);
                    const dy = Math.abs(Number(event.clientY || 0) - holdStartY);
                    if (dx > HOLD_MOVE_CANCEL_PX || dy > HOLD_MOVE_CANCEL_PX) {
                        clearHoldTimer();
                    }
                };

                const endHold = (event) => {
                    if (
                        event &&
                        holdPointerId !== null &&
                        event.pointerId !== undefined &&
                        event.pointerId !== holdPointerId
                    ) {
                        return;
                    }
                    clearHoldTimer();
                    if (holdActivated) {
                        card.dataset.suppressNextClick = "true";
                    }
                    holdPointerId = null;
                };

                card.addEventListener("pointerdown", beginHold, { passive: true });
                card.addEventListener("pointermove", moveHold, { passive: true });
                card.addEventListener("pointerup", endHold, { passive: true });
                card.addEventListener("pointercancel", endHold, { passive: true });
                card.addEventListener("pointerleave", endHold, { passive: true });
                card.addEventListener("contextmenu", (event) => {
                    event.preventDefault();
                });
            }

            card.addEventListener("click", (event) => {
                if (card.dataset.suppressNextClick === "true") {
                    card.dataset.suppressNextClick = "false";
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                clearAllPreviews();
                openVideoDialog(meta);
            });

            return card;
        }

        function renderGrid() {
            state.cards.forEach((card) => clearThumbnailRetry(card));
            videoGridEl.innerHTML = "";
            state.cards = [];
            state.cardMeta = new WeakMap();

            const filtered = getVisibleVideos();
            emptyStateEl.hidden = filtered.length > 0;

            if (!filtered.length) {
                buildBreadcrumbs();
                return;
            }

            buildObserver();
            buildPreviewObserver();
            filtered.forEach((meta, idx) => {
                const card = renderCard(meta, idx);
                state.cards.push(card);
                state.cardMeta.set(card, meta);
                videoGridEl.appendChild(card);
                state.observer.observe(card);
                state.previewObserver.observe(card);
            });

            buildBreadcrumbs();
        }

        function buildLibrarySignature(payload) {
            const files = Array.isArray(payload.files) ? payload.files : [];
            let hash = 2166136261;

            for (const file of files) {
                const path = String(file.path || "");
                for (let i = 0; i < path.length; i += 1) {
                    hash ^= path.charCodeAt(i);
                    hash = Math.imul(hash, 16777619);
                }

                const duration = Number(file.durationSeconds || 0) | 0;
                const added = Number(file.dateAddedTs || 0) | 0;
                const size = Number(file.fileSizeBytes || 0) | 0;
                const subtitlesCount = Array.isArray(file.subtitles) ? file.subtitles.length : 0;

                hash ^= duration;
                hash = Math.imul(hash, 16777619);
                hash ^= added;
                hash = Math.imul(hash, 16777619);
                hash ^= size;
                hash = Math.imul(hash, 16777619);
                hash ^= subtitlesCount;
                hash = Math.imul(hash, 16777619);
            }

            const count = Number(payload.count || files.length || 0);
            const rootName = String(payload.root?.name || "");
            return `${count}|${rootName}|${hash >>> 0}`;
        }

        function normalizeGenerationState(value) {
            const stateValue = String(value || "").toLowerCase();
            if (["ready", "pending", "failed", "missing"].includes(stateValue)) {
                return stateValue;
            }
            return "missing";
        }

        function hasPendingGeneration(item) {
            return [item.thumbnailState, item.previewState, item.scrubState]
                .map((value) => normalizeGenerationState(value))
                .includes("pending");
        }

        function hasFailedGeneration(item) {
            return [item.thumbnailState, item.previewState, item.scrubState]
                .map((value) => normalizeGenerationState(value))
                .includes("failed");
        }

        function summaryChip(label, stats) {
            const chip = document.createElement("div");
            chip.className = "summary-chip";

            const title = document.createElement("strong");
            title.textContent = label;
            chip.appendChild(title);

            const text = document.createElement("span");
            const ready = Number(stats?.ready || 0);
            const pending = Number(stats?.pending || 0);
            const failed = Number(stats?.failed || 0);
            const missing = Number(stats?.missing || 0);
            text.textContent = `${ready} ready, ${pending} pending, ${failed} failed, ${missing} missing`;
            chip.appendChild(text);

            return chip;
        }

        function generationBadge(stateValue) {
            const normalized = normalizeGenerationState(stateValue);
            const badge = document.createElement("span");
            badge.className = `gen-badge ${normalized}`;
            badge.textContent = normalized;
            return badge;
        }

        function processPathLabel(item) {
            const name = String(item.name || "").trim();
            if (name) {
                return name;
            }
            const rawPath = String(item.path || "").trim();
            if (!rawPath) {
                return "Unknown";
            }
            const parts = rawPath.split("/");
            return parts[parts.length - 1] || rawPath;
        }

        function renderGenerationPanel() {
            const items = Array.isArray(state.generationItems) ? [...state.generationItems] : [];
            const summary = state.generationSummary || {};

            generationSummaryEl.innerHTML = "";
            generationSummaryEl.appendChild(summaryChip("Thumbnails", summary.thumbnail));
            generationSummaryEl.appendChild(summaryChip("Previews", summary.preview));
            generationSummaryEl.appendChild(summaryChip("Scrubbing", summary.scrub));

            generationRowsEl.innerHTML = "";

            if (!items.length) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 4;
                cell.className = "generation-empty";
                cell.textContent = "No videos indexed yet.";
                row.appendChild(cell);
                generationRowsEl.appendChild(row);
                return;
            }

            const stateRank = { pending: 0, failed: 1, missing: 2, ready: 3 };
            items.sort((a, b) => {
                const aRank = Math.min(
                    stateRank[normalizeGenerationState(a.thumbnailState)],
                    stateRank[normalizeGenerationState(a.previewState)],
                    stateRank[normalizeGenerationState(a.scrubState)]
                );
                const bRank = Math.min(
                    stateRank[normalizeGenerationState(b.thumbnailState)],
                    stateRank[normalizeGenerationState(b.previewState)],
                    stateRank[normalizeGenerationState(b.scrubState)]
                );
                if (aRank !== bRank) {
                    return aRank - bRank;
                }
                return processPathLabel(a).localeCompare(processPathLabel(b), undefined, {
                    sensitivity: "base",
                    numeric: true,
                });
            });

            const fragment = document.createDocumentFragment();
            for (const item of items) {
                const row = document.createElement("tr");

                const thumbnailCell = document.createElement("td");
                thumbnailCell.appendChild(generationBadge(item.thumbnailState));
                row.appendChild(thumbnailCell);

                const previewCell = document.createElement("td");
                previewCell.appendChild(generationBadge(item.previewState));
                row.appendChild(previewCell);

                const scrubCell = document.createElement("td");
                scrubCell.appendChild(generationBadge(item.scrubState));
                row.appendChild(scrubCell);

                const pathCell = document.createElement("td");
                pathCell.className = "generation-path";
                pathCell.textContent = processPathLabel(item);
                pathCell.title = String(item.path || processPathLabel(item));
                row.appendChild(pathCell);

                fragment.appendChild(row);
            }

            generationRowsEl.appendChild(fragment);
        }

        function scheduleGenerationPoll(delayMs = 1800) {
            if (state.generationPollTimer) {
                window.clearTimeout(state.generationPollTimer);
            }
            state.generationPollTimer = window.setTimeout(() => {
                loadGenerationStatuses({ isPoll: true });
            }, delayMs);
        }

        function clearGenerationPoll() {
            if (state.generationPollTimer) {
                window.clearTimeout(state.generationPollTimer);
                state.generationPollTimer = null;
            }
        }

        async function loadGenerationStatuses(options = {}) {
            if (state.generationRequestInFlight) {
                return;
            }

            state.generationRequestInFlight = true;
            try {
                const response = await fetch("/api/status/all", { cache: "no-store" });
                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || "Failed to load generation status");
                }

                state.generationItems = Array.isArray(payload.items) ? payload.items : [];
                state.generationSummary = payload.summary || {};
                renderGenerationPanel();

                const pendingCount = state.generationItems.filter((item) => hasPendingGeneration(item)).length;
                const failedCount = state.generationItems.filter((item) => hasFailedGeneration(item)).length;
                const totalCount = Number(payload.count || state.generationItems.length || 0);
                const previewJobRunning = Boolean(payload.jobs?.preview?.running);
                const scrubJobRunning = Boolean(payload.jobs?.scrub?.running);

                generationMetaEl.textContent = `${totalCount} videos tracked | ${pendingCount} active | ${failedCount} failed`;
                generateAllPreviewsBtn.disabled = previewJobRunning || state.generationActionInFlight;
                generateAllScrubBtn.disabled = scrubJobRunning || state.generationActionInFlight;
                cleanDataFolderBtn.disabled =
                    previewJobRunning || scrubJobRunning || state.generationActionInFlight || state.cleanupRequestInFlight;
                generateAllPreviewsBtn.textContent = previewJobRunning ? "Generating All Previews..." : "Generate All Previews";
                generateAllScrubBtn.textContent = scrubJobRunning ? "Generating All Scrubbing..." : "Generate All Scrubbing";
                if (!state.cleanupRequestInFlight) {
                    cleanDataFolderBtn.textContent = "Clean Data Folder";
                }

                const pollDelay = payload.indexing || pendingCount > 0 ? 1800 : 6000;
                scheduleGenerationPoll(pollDelay);
            } catch (error) {
                generationMetaEl.textContent = `Generation status unavailable: ${error.message}`;
                generateAllPreviewsBtn.disabled = state.generationActionInFlight;
                generateAllScrubBtn.disabled = state.generationActionInFlight;
                cleanDataFolderBtn.disabled = state.generationActionInFlight || state.cleanupRequestInFlight;
                scheduleGenerationPoll(5000);
            } finally {
                state.generationRequestInFlight = false;
            }
        }

        function scheduleLibraryPoll(delayMs = 1200) {
            if (state.libraryPollTimer) {
                window.clearTimeout(state.libraryPollTimer);
            }
            state.libraryPollTimer = window.setTimeout(() => {
                loadLibrary({ isPoll: true });
            }, delayMs);
        }

        function clearLibraryPoll() {
            if (state.libraryPollTimer) {
                window.clearTimeout(state.libraryPollTimer);
                state.libraryPollTimer = null;
            }
        }

        async function loadLibrary(options = {}) {
            const isPoll = Boolean(options.isPoll);
            if (!isPoll) {
                statusText.textContent = "Loading library...";
            }

            try {
                const response = await fetch("/api/browse", { cache: "no-store" });
                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || "Failed to load library");
                }

                const signature = buildLibrarySignature(payload);
                const libraryChanged = signature !== state.lastLibrarySignature;

                if (libraryChanged) {
                    state.lastLibrarySignature = signature;
                    state.root = payload.root;
                    state.videos = payload.files || [];
                    if (!state.folderExpansionInitialized) {
                        state.expandedFolders = collectFolderPaths(state.root);
                        state.folderExpansionInitialized = true;
                    }
                }

                const isIndexing = Boolean(payload.indexing);

                if (isIndexing) {
                    statusText.textContent = `Indexing... ${payload.count} videos ready`;
                    scheduleLibraryPoll(payload.count > 0 ? 1600 : 900);
                } else {
                    clearLibraryPoll();
                    statusText.textContent = `${payload.count} videos`;
                }

                if (!payload.ffmpeg || !payload.ffprobe) {
                    statusText.textContent += " | ffmpeg missing";
                }

                if (libraryChanged) {
                    renderFolders();
                    renderGrid();
                }

                loadGenerationStatuses({ isPoll });

                if (isIndexing && payload.count === 0) {
                    emptyStateEl.hidden = false;
                    emptyStateEl.textContent = "Indexing videos...";
                }
            } catch (error) {
                clearLibraryPoll();
                statusText.textContent = "Error loading videos";
                emptyStateEl.hidden = false;
                emptyStateEl.textContent = error.message;
            }
        }

        searchInputEl.addEventListener("input", () => {
            state.searchQuery = searchInputEl.value;
            updateSearchClearButton();
            renderGrid();
        });

        clearSearchBtnEl.addEventListener("click", () => {
            if (!searchInputEl.value) {
                return;
            }
            searchInputEl.value = "";
            state.searchQuery = "";
            updateSearchClearButton();
            renderGrid();
            searchInputEl.focus();
        });

        sortSelectEl.addEventListener("change", () => {
            const nextSortKey = sortSelectEl.value;
            if (state.sortKey !== nextSortKey) {
                if (nextSortKey === "random") {
                    rerandomizeVideos();
                } else {
                    state.sortDirection = defaultSortDirection(nextSortKey);
                }
            }
            state.sortKey = nextSortKey;
            saveSortPreferences();
            updateSortDirectionButton();
            renderGrid();
        });

        itemSizeSelectEl.addEventListener("change", () => {
            applyItemSize(itemSizeSelectEl.value);
            saveItemSizePreference();
        });

        previewModeToggleEl.addEventListener("change", () => {
            setPreviewModeEnabled(previewModeToggleEl.checked);
            savePreviewModePreference();
        });

        sortDirBtnEl.addEventListener("click", () => {
            state.sortDirection = state.sortDirection >= 0 ? -1 : 1;
            saveSortPreferences();
            updateSortDirectionButton();
            renderGrid();
        });

        rerandomizeBtnEl.addEventListener("click", () => {
            if (state.sortKey !== "random") {
                return;
            }
            rerandomizeVideos();
            renderGrid();
        });

        reindexBtnEl.addEventListener("click", () => {
            triggerReindex();
        });

        generateAllPreviewsBtn.addEventListener("click", () => {
            triggerBulkGeneration("preview");
        });

        generateAllScrubBtn.addEventListener("click", () => {
            triggerBulkGeneration("scrub");
        });

        cleanDataFolderBtn.addEventListener("click", () => {
            triggerDataCleanup();
        });

        reloadGenerationStatusBtn.addEventListener("click", () => {
            generationMetaEl.textContent = "Reloading generation status...";
            clearGenerationPoll();
            loadGenerationStatuses();
        });

        loadSortPreferences();
        loadItemSizePreference();
        loadPreviewModePreference();
        loadAutoNextPreference();
        updateSearchClearButton();
        updateSortDirectionButton();
        initProPlayer();
        loadLibrary();
        loadGenerationStatuses();
    </script>
</body>
</html>
