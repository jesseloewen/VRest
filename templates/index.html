<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRest Video Browser</title>
    <meta name="theme-color" content="#112227" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VRest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/favicon-16x16.png') }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}" />
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"
    />
    <style>
        :root {
            --bg0: #061316;
            --bg1: #112227;
            --bg2: #1a3138;
            --panel: rgba(10, 20, 24, 0.78);
            --panel-border: rgba(141, 208, 197, 0.18);
            --text: #e6f4ef;
            --muted: #8fb8ad;
            --accent: #5ad8b8;
            --accent-strong: #2dbf98;
            --warn: #f2b965;
            --danger: #e46969;
            --shadow: 0 16px 38px rgba(2, 7, 8, 0.4);
            --radius: 16px;
            --grid-min: 220px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Space Grotesk", sans-serif;
            color: var(--text);
            overflow-x: hidden;
            background:
                radial-gradient(circle at 15% 10%, rgba(90, 216, 184, 0.22), transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(242, 185, 101, 0.16), transparent 35%),
                linear-gradient(145deg, var(--bg0), var(--bg1) 48%, var(--bg2));
        }

        .app-shell {
            display: grid;
            grid-template-columns: 290px minmax(0, 1fr);
            grid-template-rows: 74px minmax(0, 1fr);
            height: 100vh;
            transition: grid-template-columns 180ms ease;
        }

        .app-shell.sidebar-collapsed {
            grid-template-columns: 0 minmax(0, 1fr);
        }

        .topbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: rgba(5, 11, 13, 0.75);
            backdrop-filter: blur(7px);
            border-bottom: 1px solid rgba(141, 208, 197, 0.17);
            position: relative;
            z-index: 5;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: "Bebas Neue", sans-serif;
            letter-spacing: 1.2px;
            font-size: 2rem;
            color: var(--accent);
            text-shadow: 0 0 22px rgba(90, 216, 184, 0.45);
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
            flex: 0 0 auto;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1 1 auto;
            justify-content: flex-end;
        }

        .toggle-btn {
            border: 1px solid rgba(141, 208, 197, 0.3);
            background: rgba(25, 51, 58, 0.6);
            color: var(--text);
            border-radius: 10px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            transition: all 180ms ease;
        }

        .toggle-btn:hover {
            border-color: rgba(90, 216, 184, 0.75);
            transform: translateY(-1px);
        }

        .logout-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .logout-btn svg {
            display: block;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .topbar-status {
            color: var(--muted);
            font-size: 0.92rem;
            text-align: right;
            min-width: 0;
            flex: 1 1 auto;
        }

        .generation-toggle-btn {
            width: auto;
            min-width: 122px;
            padding: 0 12px;
            font-size: 0.86rem;
            font-weight: 600;
            flex: 0 0 auto;
        }

        .preview-mode-toggle {
            height: 40px;
            padding: 0 10px;
            border: 1px solid rgba(141, 208, 197, 0.3);
            background: rgba(9, 19, 22, 0.7);
            color: var(--text);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            flex: 0 0 auto;
        }

        .preview-mode-toggle:hover {
            border-color: rgba(90, 216, 184, 0.75);
            background: rgba(12, 25, 30, 0.9);
        }

        .preview-mode-text {
            font-size: 0.82rem;
            font-weight: 600;
            color: #dffaf3;
            letter-spacing: 0.01em;
        }

        .preview-mode-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .preview-mode-switch {
            position: relative;
            width: 38px;
            height: 22px;
            border-radius: 999px;
            background: rgba(120, 151, 146, 0.45);
            border: 1px solid rgba(141, 208, 197, 0.32);
            transition: background 150ms ease, border-color 150ms ease;
        }

        .preview-mode-switch::after {
            content: "";
            position: absolute;
            left: 2px;
            top: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ecfffa;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            transition: transform 150ms ease;
        }

        .preview-mode-input:checked + .preview-mode-switch {
            background: rgba(45, 191, 152, 0.66);
            border-color: rgba(90, 216, 184, 0.8);
        }

        .preview-mode-input:checked + .preview-mode-switch::after {
            transform: translateX(16px);
        }

        .preview-mode-input:focus-visible + .preview-mode-switch {
            outline: 2px solid rgba(90, 216, 184, 0.8);
            outline-offset: 2px;
        }

        .sidebar {
            padding: 14px;
            border-right: 1px solid var(--panel-border);
            overflow-y: auto;
            background: rgba(3, 8, 10, 0.65);
            backdrop-filter: blur(5px);
            min-width: 0;
            transform: translateX(0);
            transition: transform 180ms ease, padding 180ms ease, border-color 180ms ease;
        }

        .app-shell.sidebar-collapsed .sidebar {
            transform: translateX(-100%);
            padding-left: 0;
            padding-right: 0;
            border-right-color: transparent;
            overflow: hidden;
            pointer-events: none;
        }

        .sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(1, 4, 6, 0.52);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
            z-index: 6;
        }

        .sidebar h2 {
            margin: 0 0 10px;
            font-size: 1.02rem;
            font-weight: 600;
            color: #c7efe3;
        }

        .tree-list {
            list-style: none;
            margin: 0;
            padding-left: 0;
        }

        .tree-item {
            margin-bottom: 4px;
        }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tree-toggle,
        .tree-spacer {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            flex: 0 0 22px;
        }

        .tree-toggle {
            border: 0;
            background: rgba(90, 216, 184, 0.12);
            color: #d6f7ee;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            font-size: 12px;
        }

        .tree-toggle:hover {
            background: rgba(90, 216, 184, 0.24);
        }

        .tree-button {
            width: 100%;
            text-align: left;
            border: 0;
            padding: 6px 9px;
            border-radius: 8px;
            color: #d0e8df;
            background: transparent;
            cursor: pointer;
            font: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tree-button:hover,
        .tree-button.active {
            background: rgba(90, 216, 184, 0.18);
            color: #f3fffb;
        }

        .tree-children {
            list-style: none;
            margin: 0;
            padding-left: 13px;
            border-left: 1px dashed rgba(141, 208, 197, 0.23);
        }

        .main {
            padding: 14px 16px 24px;
            overflow-y: auto;
        }

        .alert {
            border: 1px solid rgba(228, 105, 105, 0.4);
            color: #ffe1e1;
            background: rgba(89, 29, 29, 0.56);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .crumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        .library-tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .generation-panel {
            position: fixed;
            right: 0;
            top: 74px;
            bottom: 0;
            width: min(520px, 44vw);
            border: 1px solid var(--panel-border);
            border-top: 0;
            border-right: 0;
            border-radius: 16px 0 0 0;
            background: rgba(7, 16, 20, 0.92);
            box-shadow: var(--shadow);
            overflow: hidden;
            z-index: 8;
            transform: translateX(103%);
            transition: transform 220ms ease;
            display: flex;
            flex-direction: column;
        }

        .app-shell.generation-open .generation-panel {
            transform: translateX(0);
        }

        .generation-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(141, 208, 197, 0.2);
            background: rgba(5, 12, 15, 0.68);
        }

        .generation-head-tools {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .generation-close {
            border: 0;
            background: rgba(228, 105, 105, 0.9);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .generation-head h3 {
            margin: 0;
            font-size: 0.95rem;
            color: #dbf9f1;
            letter-spacing: 0.01em;
        }

        .generation-meta {
            font-size: 0.8rem;
            color: var(--muted);
            text-align: right;
        }

        .generation-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(141, 208, 197, 0.16);
        }

        .generation-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(141, 208, 197, 0.16);
        }

        .generation-action-btn {
            border: 1px solid rgba(141, 208, 197, 0.36);
            background: rgba(13, 28, 32, 0.86);
            color: var(--text);
            border-radius: 10px;
            padding: 7px 10px;
            font: inherit;
            font-size: 0.76rem;
            cursor: pointer;
            transition: border-color 140ms ease, background 140ms ease;
        }

        .generation-action-btn:hover {
            border-color: rgba(90, 216, 184, 0.8);
            background: rgba(14, 33, 37, 0.95);
        }

        .generation-action-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .summary-chip {
            border: 1px solid rgba(141, 208, 197, 0.2);
            border-radius: 10px;
            background: rgba(10, 20, 24, 0.72);
            padding: 8px 9px;
            font-size: 0.78rem;
            color: #d9f5ee;
            line-height: 1.3;
        }

        .summary-chip strong {
            display: block;
            margin-bottom: 3px;
            font-size: 0.82rem;
            color: #f1fffb;
        }

        .generation-table-wrap {
            overflow-y: auto;
            overflow-x: hidden;
            max-height: none;
            flex: 1;
        }

        .generation-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            table-layout: fixed;
        }

        .generation-table th,
        .generation-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(141, 208, 197, 0.14);
            text-align: left;
            vertical-align: middle;
        }

        .generation-table thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: rgba(6, 14, 17, 0.96);
            color: #bfe9dd;
            font-weight: 600;
        }

        .generation-path {
            display: block;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e8fff8;
        }

        .generation-state-col {
            width: 88px;
        }

        .gen-badge {
            display: inline-block;
            min-width: 66px;
            text-align: center;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.72rem;
            text-transform: capitalize;
            letter-spacing: 0.01em;
        }

        .gen-badge.ready {
            color: #caf9eb;
            background: rgba(38, 132, 105, 0.3);
            border-color: rgba(97, 219, 185, 0.4);
        }

        .gen-badge.pending {
            color: #fff2d7;
            background: rgba(150, 104, 38, 0.34);
            border-color: rgba(242, 185, 101, 0.48);
        }

        .gen-badge.failed {
            color: #ffe0e0;
            background: rgba(121, 40, 40, 0.4);
            border-color: rgba(228, 105, 105, 0.52);
        }

        .gen-badge.missing {
            color: #d7ece6;
            background: rgba(56, 84, 91, 0.36);
            border-color: rgba(146, 190, 182, 0.38);
        }

        .generation-empty {
            color: #b8dbd1;
        }

        .generation-backdrop {
            position: fixed;
            inset: 74px 0 0 0;
            background: rgba(1, 4, 6, 0.52);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
            z-index: 7;
        }

        .search-wrap {
            position: relative;
            min-width: min(340px, 90vw);
            flex: 1 1 auto;
        }

        .search-input,
        .sort-select,
        .sort-dir-btn {
            font: inherit;
            color: var(--text);
            border: 1px solid rgba(141, 208, 197, 0.3);
            background: rgba(9, 19, 22, 0.7);
            border-radius: 10px;
            transition: border-color 140ms ease, background 140ms ease;
        }

        .search-input {
            min-width: 0;
            width: 100%;
            padding: 8px 38px 8px 10px;
            outline: none;
        }

        .search-clear-btn {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            border: 0;
            border-radius: 999px;
            padding: 0;
            cursor: pointer;
            background: rgba(141, 208, 197, 0.2);
            color: #dbf9f1;
            font: inherit;
            font-size: 0.92rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 140ms ease, transform 140ms ease;
        }

        .search-clear-btn:hover {
            background: rgba(141, 208, 197, 0.35);
            transform: translateY(-50%) scale(1.03);
        }

        .search-clear-btn:focus-visible {
            outline: 2px solid rgba(90, 216, 184, 0.7);
            outline-offset: 1px;
        }

        .search-input::placeholder {
            color: #9bc4b8;
        }

        .sort-select {
            padding: 8px 10px;
            outline: none;
        }

        .item-size-select {
            min-width: 116px;
        }

        .sort-dir-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 40px;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
        }

        .sort-dir-btn[hidden] {
            display: none !important;
        }

        .shuffle-icon {
            display: block;
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .randomize-btn {
            width: auto;
            min-width: 108px;
            padding: 0 12px;
            font-size: 0.84rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .search-input:focus,
        .sort-select:focus,
        .sort-dir-btn:hover {
            border-color: rgba(90, 216, 184, 0.8);
            background: rgba(12, 25, 30, 0.9);
        }

        .crumb {
            border: 0;
            border-radius: 8px;
            background: rgba(141, 208, 197, 0.16);
            color: #d9f7ef;
            padding: 6px 10px;
            cursor: pointer;
            font: inherit;
            font-size: 0.87rem;
        }

        .crumb:hover {
            background: rgba(141, 208, 197, 0.25);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
            gap: 16px;
            opacity: 0;
            animation: appear 420ms ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            cursor: pointer;
            transform: translateZ(0);
            transition: transform 180ms ease, border-color 180ms ease;
            position: relative;
            min-height: 200px;
        }

        .video-card:hover {
            transform: scale(1.08);
            z-index: 3;
            border-color: rgba(90, 216, 184, 0.45);
        }

        .card-media {
            position: relative;
            aspect-ratio: 16 / 9;
            background: rgba(8, 15, 18, 0.92);
            overflow: hidden;
        }

        .duration-pill {
            font-size: 0.74rem;
            color: #e9fff9;
            background: rgba(4, 12, 15, 0.72);
            border: 1px solid rgba(141, 208, 197, 0.55);
            border-radius: 999px;
            padding: 4px 8px;
            backdrop-filter: blur(2px);
            flex: 0 0 auto;
            margin-left: auto;
        }

        .card-thumb,
        .card-preview {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
        }

        .card-preview {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 140ms ease;
        }

        .video-card.previewing .card-preview {
            opacity: 1;
        }

        .video-card.previewing .card-thumb {
            opacity: 0;
        }

        .preview-loader,
        .preview-error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            text-align: center;
            padding: 8px;
            color: #f3fff8;
            background: rgba(4, 8, 10, 0.72);
        }

        .video-card.preview-loading .preview-loader {
            display: flex;
        }

        .video-card.preview-error .preview-error {
            display: flex;
            color: #ffd8d8;
            background: rgba(55, 20, 20, 0.82);
        }

        .card-body {
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .card-title {
            font-size: 0.97rem;
            line-height: 1.2;
            min-height: 2.25em;
            margin: 0;
            word-break: break-word;
        }

        .folder-pill {
            display: inline-block;
            font-size: 0.74rem;
            color: #0a1618;
            background: linear-gradient(90deg, var(--accent), #79f0d2);
            border-radius: 999px;
            padding: 4px 8px;
            width: fit-content;
            max-width: calc(100% - 72px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 0 1 auto;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-width: 0;
        }

        .video-card.skeleton .card-media {
            background: linear-gradient(
                102deg,
                rgba(32, 60, 67, 0.85) 20%,
                rgba(57, 101, 112, 0.95) 38%,
                rgba(34, 63, 71, 0.85) 54%
            );
            background-size: 220% 100%;
            animation: shimmer 1.35s infinite linear;
        }

        @keyframes shimmer {
            from {
                background-position: 160% 0;
            }
            to {
                background-position: -70% 0;
            }
        }

        dialog.video-dialog {
            width: min(92vw, 1080px);
            max-width: 92vw;
            max-height: 96dvh;
            border: 1px solid rgba(141, 208, 197, 0.42);
            border-radius: 14px;
            background: rgba(5, 10, 12, 0.98);
            color: var(--text);
            padding: 12px;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: auto;
        }

        dialog.video-dialog:not([open]) {
            display: none;
        }

        dialog.video-dialog[open] {
            display: flex;
        }

        dialog.video-dialog::backdrop {
            backdrop-filter: blur(5px);
            background: rgba(3, 6, 8, 0.62);
        }

        .dialog-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 12px;
            min-width: 0;
        }

        .dialog-head h3 {
            margin: 0;
            font-size: 1.05rem;
            flex: 1 1 auto;
            min-width: 0;
            line-height: 1.25;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .dialog-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .dialog-close {
            border: 0;
            background: rgba(228, 105, 105, 0.9);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .player {
            width: 100%;
            height: 100%;
            max-height: 100%;
            border-radius: 10px;
            background: #000;
            object-fit: contain;
        }

        .player-shell {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            height: min(calc(96dvh - 120px), calc(92vw * 9 / 16));
            max-height: calc(96dvh - 120px);
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .player-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border: 1px solid rgba(141, 208, 197, 0.45);
            border-radius: 999px;
            background: rgba(6, 12, 15, 0.68);
            color: #e7fff7;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            z-index: 6;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 120ms ease, background-color 120ms ease, border-color 120ms ease;
        }

        .player-nav-btn:hover:not(:disabled) {
            background: rgba(17, 32, 37, 0.85);
            border-color: rgba(141, 208, 197, 0.75);
        }

        .player-nav-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .player-auto-next {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 6;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(141, 208, 197, 0.45);
            background: rgba(6, 12, 15, 0.68);
            color: #e7fff7;
            font-size: 0.74rem;
            line-height: 1;
            cursor: pointer;
            transition: opacity 120ms ease, background-color 120ms ease, border-color 120ms ease;
            user-select: none;
        }

        .player-auto-next:hover {
            background: rgba(17, 32, 37, 0.85);
            border-color: rgba(141, 208, 197, 0.75);
        }

        .player-auto-next input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .player-auto-next-slider {
            position: relative;
            width: 34px;
            height: 18px;
            border-radius: 999px;
            background: rgba(90, 216, 184, 0.2);
            border: 1px solid rgba(141, 208, 197, 0.35);
            transition: background-color 120ms ease, border-color 120ms ease;
        }

        .player-auto-next-slider::after {
            content: "";
            position: absolute;
            top: 1px;
            left: 1px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #dffbf3;
            transition: transform 120ms ease;
        }

        .player-auto-next input:checked + .player-auto-next-slider {
            background: rgba(90, 216, 184, 0.55);
            border-color: rgba(141, 208, 197, 0.85);
        }

        .player-auto-next input:checked + .player-auto-next-slider::after {
            transform: translateX(16px);
        }

        .player-fullscreen-title {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 120px;
            z-index: 6;
            display: none;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(141, 208, 197, 0.45);
            background: rgba(6, 12, 15, 0.68);
            color: #e7fff7;
            font-size: 0.8rem;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            opacity: 0;
            transition: opacity 120ms ease;
        }

        .player-shell.is-fullscreen .player-fullscreen-title {
            display: block;
            opacity: 1;
        }

        .player-shell.is-fullscreen.nav-controls-hidden .player-fullscreen-title {
            opacity: 0;
        }

        .player-shell.nav-controls-hidden .player-nav-btn {
            opacity: 0;
            pointer-events: none;
        }

        .player-shell.nav-controls-hidden .player-auto-next {
            opacity: 0;
            pointer-events: none;
        }

        .player-shell.nav-controls-hidden.is-playing,
        .player-shell.nav-controls-hidden.is-playing .plyr,
        .player-shell.nav-controls-hidden.is-playing .plyr *,
        .player-shell.nav-controls-hidden.is-playing video {
            cursor: none;
        }

        .player-nav-prev {
            left: 12px;
        }

        .player-nav-next {
            right: 12px;
        }

        .plyr {
            width: 100%;
            height: 100%;
            max-height: 100%;
        }

        .plyr video {
            object-fit: contain;
        }

        .seek-toast {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 10, 14, 0.8);
            border: 1px solid rgba(141, 208, 197, 0.45);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.82rem;
            color: #dffbf3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 120ms ease;
            z-index: 4;
        }

        .seek-toast.visible {
            opacity: 1;
        }

        .hold-speed-indicator {
            position: absolute;
            left: 50%;
            top: 12px;
            transform: translateX(-50%);
            background: rgba(5, 10, 14, 0.82);
            border: 1px solid rgba(141, 208, 197, 0.45);
            border-radius: 999px;
            padding: 5px 11px;
            font-size: 0.76rem;
            letter-spacing: 0.01em;
            color: #dffbf3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 120ms ease;
            z-index: 6;
        }

        .hold-speed-indicator.visible {
            opacity: 1;
        }

        .scrub-preview {
            position: absolute;
            bottom: 54px;
            left: 0;
            transform: translateX(-50%);
            width: auto;
            border-radius: 10px;
            border: 1px solid rgba(141, 208, 197, 0.58);
            background: rgba(2, 7, 9, 0.92);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity 120ms ease;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .scrub-preview.visible {
            opacity: 1;
        }

        .scrub-preview-image {
            width: 160px;
            height: 90px;
            background-color: #000;
            background-repeat: no-repeat;
            background-position: 0 0;
            background-size: auto;
        }

        .scrub-preview-time {
            padding: 4px 8px 6px;
            font-size: 0.74rem;
            color: #d9f9f0;
            text-align: center;
        }

        .plyr--full-ui input[type="range"] {
            color: var(--accent);
        }

        .empty-state {
            margin-top: 24px;
            color: #b5d7cc;
        }

        @media (max-width: 900px) {
            .app-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 74px minmax(0, 1fr);
            }

            .topbar {
                padding: 0 10px;
            }

            .topbar-left {
                gap: 8px;
            }

            .topbar-right {
                gap: 6px;
            }

            .preview-mode-toggle {
                min-width: 0;
                padding: 0 6px;
            }

            .preview-mode-text {
                display: none;
            }

            .brand {
                font-size: 1.55rem;
            }

            .generation-toggle-btn {
                min-width: 0;
                padding: 0 9px;
                font-size: 0.76rem;
            }

            .topbar-right .randomize-btn {
                min-width: 92px;
                padding: 0 10px;
                font-size: 0.76rem;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 74px;
                bottom: 0;
                width: min(78vw, 320px);
                transform: translateX(-102%);
                transition: transform 180ms ease;
                border-right: 1px solid rgba(141, 208, 197, 0.24);
                border-bottom: none;
                z-index: 7;
            }

            .main {
                grid-row: 2;
            }

            .library-tools {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 6px;
            }

            .search-wrap {
                min-width: 0;
                width: 100%;
                grid-column: 1 / -1;
            }

            .sort-select {
                min-width: 0;
                width: 100%;
            }

            #sortSelect {
                grid-column: 1;
                grid-row: 2;
            }

            #sortDirBtn,
            #rerandomizeBtn {
                grid-column: 2;
                grid-row: 2;
                width: 40px;
                height: 40px;
                min-width: 40px;
            }

            #itemSizeSelect {
                grid-column: 1 / -1;
                grid-row: 3;
                width: 100%;
            }

            .app-shell.sidebar-open .sidebar {
                transform: translateX(0);
            }

            .app-shell.sidebar-open ~ .sidebar-backdrop {
                opacity: 1;
                pointer-events: auto;
            }

            .topbar-status {
                max-width: clamp(72px, 30vw, 150px);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                font-size: 0.78rem;
            }

            .generation-panel {
                width: min(95vw, 460px);
            }

            .app-shell.generation-open .generation-panel {
                transform: translateX(0);
            }

            .video-card {
                -webkit-touch-callout: none;
                user-select: none;
            }

            .video-grid {
                grid-template-columns: repeat(var(--mobile-grid-columns, 2), minmax(0, 1fr));
            }

            dialog.video-dialog {
                width: 100vw;
                max-width: 100vw;
                max-height: 100dvh;
                min-height: 100dvh;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
                border-bottom: 0;
                padding: 10px;
                justify-content: center;
                gap: 8px;
            }

            .dialog-head {
                margin-bottom: 0;
            }

            .player-shell {
                height: min(calc(100dvh - 110px), calc(100vw * 9 / 16));
                max-height: calc(100dvh - 110px);
                margin-inline: auto;
            }

            .player-nav-btn {
                width: 40px;
                height: 40px;
            }

            .player-auto-next {
                top: 8px;
                right: 8px;
                padding: 5px 8px;
                font-size: 0.7rem;
            }

            .player-nav-prev {
                left: 8px;
            }

            .player-nav-next {
                right: 8px;
            }

            .generation-summary {
                grid-template-columns: 1fr;
            }

            .generation-actions {
                flex-direction: column;
            }

            .generation-action-btn {
                width: 100%;
                text-align: left;
            }

            .generation-path {
                max-width: 240px;
            }
        }

        @media (max-width: 640px) {
            .topbar-status {
                display: none;
            }

            .topbar {
                padding: 0 8px;
            }

            .brand {
                font-size: 1.38rem;
                letter-spacing: 0.9px;
            }

            .topbar-right {
                gap: 5px;
            }

            .generation-toggle-btn,
            .preview-mode-toggle,
            .topbar-right .randomize-btn {
                min-width: 0;
                padding: 0 8px;
                font-size: 0.72rem;
            }

            .main {
                padding: 10px 10px 20px;
            }

            #rerandomizeBtn {
                width: 40px;
                min-width: 40px;
            }

            .video-grid {
                gap: 12px;
            }
        }

        @media (max-width: 420px) {
            .brand {
                font-size: 1.18rem;
                letter-spacing: 0.6px;
            }

            .toggle-btn,
            .sort-dir-btn {
                width: 36px;
                height: 36px;
                font-size: 0.95rem;
            }

            .generation-toggle-btn,
            .preview-mode-toggle,
            .topbar-right .randomize-btn {
                width: auto;
                height: 36px;
                padding: 0 7px;
            }

            .topbar {
                padding: 0 6px;
            }

            .topbar-left {
                gap: 6px;
            }

            .topbar-right {
                gap: 4px;
            }

            .brand-icon {
                width: 30px;
                height: 30px;
                border-radius: 7px;
            }

            .preview-mode-toggle {
                padding: 0 5px;
            }

            #reindexBtn {
                width: 36px;
                min-width: 36px;
                padding: 0;
                font-size: 0;
            }

            #reindexBtn::before {
                content: "↻";
                font-size: 1rem;
                line-height: 1;
            }

            .preview-mode-switch {
                width: 34px;
                height: 20px;
            }

            .preview-mode-switch::after {
                width: 14px;
                height: 14px;
            }

            .preview-mode-input:checked + .preview-mode-switch::after {
                transform: translateX(14px);
            }

            .library-tools {
                gap: 8px;
            }

            .library-tools .sort-select {
                min-height: 38px;
            }

            #sortDirBtn,
            #rerandomizeBtn {
                justify-self: end;
            }
        }

        @media (max-width: 360px) {
            .topbar {
                padding: 0 4px;
            }

            .toggle-btn,
            .sort-dir-btn,
            .generation-toggle-btn,
            .preview-mode-toggle,
            .topbar-right .randomize-btn,
            #reindexBtn {
                width: 34px;
                min-width: 34px;
                height: 34px;
                padding: 0;
            }

            .preview-mode-switch {
                width: 32px;
                height: 18px;
            }

            .preview-mode-switch::after {
                width: 12px;
                height: 12px;
            }

            .preview-mode-input:checked + .preview-mode-switch::after {
                transform: translateX(14px);
            }

            .main {
                padding: 8px 8px 16px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .player-auto-next {
                gap: 6px;
                padding: 4px 7px;
            }

            .player-auto-next span:last-child {
                display: none;
            }
        }

        .app-shell.generation-open ~ .generation-backdrop {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="app-shell" id="appShell">
        <header class="topbar">
            <div class="topbar-left">
                <button id="toggleSidebar" class="toggle-btn" aria-label="Toggle folders">☰</button>
                <div class="brand">
                    <img class="brand-icon" src="{{ url_for('static', filename='icons/icon.png') }}" alt="" aria-hidden="true" />
                    <span>VRest</span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="topbar-status" id="statusText">Scanning videos...</div>
                <label class="preview-mode-toggle" for="previewModeToggle">
                    <span class="preview-mode-text">Preview</span>
                    <input
                        id="previewModeToggle"
                        class="preview-mode-input"
                        type="checkbox"
                        aria-label="Enable preview mode"
                    />
                    <span class="preview-mode-switch" aria-hidden="true"></span>
                </label>
                <button id="reindexBtn" class="sort-dir-btn randomize-btn" type="button" title="Start indexing again">Re-Index</button>
                <button
                    id="toggleGenerationPanel"
                    class="toggle-btn generation-toggle-btn"
                    type="button"
                    aria-label="Toggle generation jobs panel"
                    aria-expanded="false"
                    aria-controls="generationPanel"
                >
                    Jobs
                </button>
                <button class="toggle-btn logout-btn" id="logoutBtn" title="Logout" aria-label="Logout" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <aside class="sidebar" id="sidebar">
            <h2>Folders</h2>
            <ul class="tree-list" id="folderTree"></ul>
        </aside>

        <main class="main">
            {% if config_error %}
            <div class="alert">{{ config_error }}</div>
            {% endif %}
            <div class="library-tools" id="libraryTools">
                <div class="search-wrap">
                    <input
                        id="searchInput"
                        class="search-input"
                        type="search"
                        placeholder="Search videos or folders"
                        aria-label="Search videos"
                    />
                    <button id="clearSearchBtn" class="search-clear-btn" type="button" aria-label="Clear search" title="Clear search" hidden>×</button>
                </div>
                <select id="sortSelect" class="sort-select" aria-label="Sort videos">
                    <option value="default">Default</option>
                    <option value="az">A-Z</option>
                    <option value="dateAdded">Date Added</option>
                    <option value="length">Length</option>
                    <option value="size">File Size</option>
                    <option value="random" selected>Random</option>
                </select>
                <button id="sortDirBtn" class="sort-dir-btn" type="button" aria-label="Reverse sort direction">↑</button>
                <button id="rerandomizeBtn" class="sort-dir-btn" type="button" title="Re-randomize video order" aria-label="Re-randomize video order" hidden>
                    <svg class="shuffle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 4l3 3-3 3 M4 17h3c4 0 6-10 10-10h3 M17 14l3 3-3 3 M4 7h3c4 0 6 10 10 10h3" />
                    </svg>
                </button>
                <select id="itemSizeSelect" class="sort-select item-size-select" aria-label="Item size">
                    <option value="xs">Size XS</option>
                    <option value="sm" selected>Size S</option>
                    <option value="md">Size M</option>
                    <option value="lg">Size L</option>
                </select>
            </div>
            <div class="crumbs" id="breadcrumbs"></div>
            <section class="video-grid" id="videoGrid"></section>
            <div class="empty-state" id="emptyState" hidden>No videos match this folder.</div>
        </main>

        <aside class="generation-panel" id="generationPanel" aria-live="polite" aria-label="Generation jobs panel">
            <div class="generation-head">
                <h3>Generation Jobs</h3>
                <div class="generation-head-tools">
                    <div class="generation-meta" id="generationMeta">Loading generation status...</div>
                    <button class="generation-close" id="closeGenerationPanel" type="button" aria-label="Close generation panel">×</button>
                </div>
            </div>
            <div class="generation-actions">
                <button id="generateAllPreviewsBtn" class="generation-action-btn" type="button">Generate All Previews</button>
                <button id="generateAllScrubBtn" class="generation-action-btn" type="button">Generate All Scrubbing</button>
                <button id="cleanDataFolderBtn" class="generation-action-btn" type="button">Clean Data Folder</button>
                <button id="reloadGenerationStatusBtn" class="generation-action-btn" type="button">Reload Job Status</button>
            </div>
            <div class="generation-summary" id="generationSummary"></div>
            <div class="generation-table-wrap">
                <table class="generation-table" aria-label="Thumbnail, preview, and scrub generation status">
                    <thead>
                        <tr>
                            <th class="generation-state-col">Thumbnail</th>
                            <th class="generation-state-col">Preview</th>
                            <th class="generation-state-col">Scrub</th>
                            <th>Title</th>
                        </tr>
                    </thead>
                    <tbody id="generationRows">
                        <tr>
                            <td colspan="4" class="generation-empty">Loading generation status...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </aside>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
    <div class="generation-backdrop" id="generationBackdrop" aria-hidden="true"></div>

    <dialog class="video-dialog" id="videoDialog">
        <div class="dialog-head">
            <h3 id="dialogTitle">Now Playing</h3>
            <div class="dialog-tools">
                <button class="dialog-close" id="dialogClose" aria-label="Close">×</button>
            </div>
        </div>
        <div class="player-shell" id="playerShell">
            <button type="button" class="player-nav-btn player-nav-prev" id="dialogPrev" aria-label="Previous video">&lt;</button>
            <button type="button" class="player-nav-btn player-nav-next" id="dialogNext" aria-label="Next video">&gt;</button>
            <label class="player-auto-next" for="autoNextToggle">
                <input type="checkbox" id="autoNextToggle" />
                <span class="player-auto-next-slider" aria-hidden="true"></span>
                <span>Auto Play</span>
            </label>
            <div class="player-fullscreen-title" id="fullscreenTitle" aria-hidden="true"></div>
            <video id="dialogPlayer" class="player" controls playsinline preload="metadata"></video>
            <div class="hold-speed-indicator" id="holdSpeedIndicator" aria-hidden="true">2x speed</div>
            <div class="seek-toast" id="seekToast"></div>
            <div class="scrub-preview" id="scrubPreview" aria-hidden="true">
                <div class="scrub-preview-image" id="scrubPreviewImage"></div>
                <div class="scrub-preview-time" id="scrubPreviewTime">0:00</div>
            </div>
        </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

    <script>
        const appShell = document.getElementById("appShell");
        const logoutBtnEl = document.getElementById("logoutBtn");
        const toggleSidebarBtn = document.getElementById("toggleSidebar");
        const toggleGenerationPanelBtn = document.getElementById("toggleGenerationPanel");
        const closeGenerationPanelBtn = document.getElementById("closeGenerationPanel");
        const sidebarBackdrop = document.getElementById("sidebarBackdrop");
        const generationBackdrop = document.getElementById("generationBackdrop");
        const statusText = document.getElementById("statusText");
        const folderTreeEl = document.getElementById("folderTree");
        const videoGridEl = document.getElementById("videoGrid");
        const emptyStateEl = document.getElementById("emptyState");
        const breadcrumbsEl = document.getElementById("breadcrumbs");
        const searchInputEl = document.getElementById("searchInput");
        const clearSearchBtnEl = document.getElementById("clearSearchBtn");
        const sortSelectEl = document.getElementById("sortSelect");
        const itemSizeSelectEl = document.getElementById("itemSizeSelect");
        const previewModeToggleEl = document.getElementById("previewModeToggle");
        const reindexBtnEl = document.getElementById("reindexBtn");
        const sortDirBtnEl = document.getElementById("sortDirBtn");
        const rerandomizeBtnEl = document.getElementById("rerandomizeBtn");
        const generationMetaEl = document.getElementById("generationMeta");
        const generateAllPreviewsBtn = document.getElementById("generateAllPreviewsBtn");
        const generateAllScrubBtn = document.getElementById("generateAllScrubBtn");
        const cleanDataFolderBtn = document.getElementById("cleanDataFolderBtn");
        const reloadGenerationStatusBtn = document.getElementById("reloadGenerationStatusBtn");
        const generationSummaryEl = document.getElementById("generationSummary");
        const generationRowsEl = document.getElementById("generationRows");
        const dialogEl = document.getElementById("videoDialog");
        const dialogTitleEl = document.getElementById("dialogTitle");
        const dialogPlayerEl = document.getElementById("dialogPlayer");
        const playerShellEl = document.getElementById("playerShell");
        const fullscreenTitleEl = document.getElementById("fullscreenTitle");
        const dialogPrevBtn = document.getElementById("dialogPrev");
        const dialogNextBtn = document.getElementById("dialogNext");
        const autoNextToggleEl = document.getElementById("autoNextToggle");
        const holdSpeedIndicatorEl = document.getElementById("holdSpeedIndicator");

        function showSeekToast(text) {
            seekToastEl.textContent = text;
            seekToastEl.classList.add("visible");

        function getActivePlayerTimeAndDuration() {
            if (plyrPlayer) {
                return {
                    currentTime: Number(plyrPlayer.currentTime || 0),
                    duration: Number(plyrPlayer.duration || 0),
                    setTime: (value) => {
                        plyrPlayer.currentTime = value;
                    },
                };
            }

            return {
                currentTime: Number(dialogPlayerEl.currentTime || 0),
                duration: Number(dialogPlayerEl.duration || 0),
                setTime: (value) => {
                    dialogPlayerEl.currentTime = value;
                },
            };
        }

        function getCurrentPlaybackRate() {
            if (plyrPlayer && Number.isFinite(Number(plyrPlayer.speed))) {
                return Number(plyrPlayer.speed);
            }
            return Number(dialogPlayerEl.playbackRate || 1);
        }

        function setPlaybackRate(rate) {
            const parsedRate = Number(rate);
            const normalizedRate = Number.isFinite(parsedRate)
                ? Math.max(0.25, Math.min(3, parsedRate))
                : 1;

            if (plyrPlayer) {
                plyrPlayer.speed = normalizedRate;
            }
            dialogPlayerEl.playbackRate = normalizedRate;
        }

        function isPlayerPaused() {
            if (plyrPlayer) {
                return Boolean(plyrPlayer.paused);
            }
            return Boolean(dialogPlayerEl.paused);
        }

        function playPlayer() {
            if (plyrPlayer) {
                return plyrPlayer.play();
            }
            return dialogPlayerEl.play();
        }

        function playPlayerImmediately() {
            const playAttempt = playPlayer();
            if (playAttempt && typeof playAttempt.catch === "function") {
                playAttempt.catch(() => {});
            }
        }

        function pausePlayer() {
            if (plyrPlayer) {
                plyrPlayer.pause();
                return;
            }
            dialogPlayerEl.pause();
        }

        function setHoldSpeedIndicatorVisible(visible) {
            if (!holdSpeedIndicatorEl) {
                return;

            holdSpeedIndicatorEl.classList.toggle("visible", Boolean(visible));
        }

        function setHoldSpeedIndicatorRate(rate) {
            if (!holdSpeedIndicatorEl) {
                return;
            }
            const normalizedRate = Number(rate);
            const labelRate = Number.isFinite(normalizedRate) ? normalizedRate : 2;
            holdSpeedIndicatorEl.textContent = `${labelRate}x speed`;
        }

        function setAutoNextEnabled(enabled) {
            state.autoNextEnabled = Boolean(enabled);

        function resolveDialogPlaylistIndexFromCurrentPath() {
            if (state.dialogPlaylistIndex >= 0) {
                return state.dialogPlaylistIndex;
            }

            const currentPath = String(state.dialogCurrentPath || "");
            if (!currentPath) {
                return -1;
            }

            state.dialogPlaylistIndex = state.dialogPlaylist.findIndex(
                (video) => String(video?.path || "") === currentPath
            );
            return state.dialogPlaylistIndex;
        }

        function maybeAutoAdvanceToNext() {
            if (!dialogEl.open || !state.autoNextEnabled) {
                return;
            }

            const playlistLength = state.dialogPlaylist.length;
            if (playlistLength <= 1) {
                return;
            }

            resolveDialogPlaylistIndexFromCurrentPath();
            openAdjacentDialogVideo(1);
        }

        function saveAutoNextPreference() {
            try {
                window.localStorage.setItem(
                    AUTO_NEXT_STORAGE_KEY,
                    state.autoNextEnabled ? "1" : "0"
                );
            } catch (error) {
                // Ignore storage errors (privacy mode, blocked storage, etc.)
            }
        }

        function loadAutoNextPreference() {
            let savedAutoNext = null;

            try {
                savedAutoNext = window.localStorage.getItem(AUTO_NEXT_STORAGE_KEY);
            } catch (error) {
                // Ignore storage errors and keep default.
            }

            setAutoNextEnabled(savedAutoNext === "1");
        }

        function shouldIgnoreHoldTarget(target) {
            if (!(target instanceof Element)) {
                return false;
            }
            return Boolean(
                target.closest(
                    ".plyr__controls, .plyr__menu, .plyr__control, .plyr__progress, .plyr__volume, .dialog-head, .dialog-tools, .dialog-close, .player-nav-btn, .player-auto-next"
                )
            );
        }

        function syncDialogPlaylist(meta, preserveCurrentPlaylist = false) {
            if (!preserveCurrentPlaylist) {
                const visible = getVisibleVideos();
                state.dialogPlaylist = Array.isArray(visible) ? visible.slice() : [];
            }

            const currentPath = String(meta?.path || "");
            state.dialogPlaylistIndex = state.dialogPlaylist.findIndex(
                (video) => String(video?.path || "") === currentPath
            );

        function updateDialogNavButtons() {
            const playlistLength = state.dialogPlaylist.length;
            const hasSelection = state.dialogPlaylistIndex >= 0;
            const canLoopNavigate = hasSelection && playlistLength > 1;

            dialogPrevBtn.disabled = !canLoopNavigate;
            dialogNextBtn.disabled = !canLoopNavigate;
        }

        function openAdjacentDialogVideo(offset) {
            const delta = Number(offset);
            if (!Number.isFinite(delta) || delta === 0) {
                return;
            }

            const playlistLength = state.dialogPlaylist.length;
            if (state.dialogPlaylistIndex < 0 || playlistLength <= 1) {
                updateDialogNavButtons();
                return;
            }

            const targetIndex =
                ((state.dialogPlaylistIndex + delta) % playlistLength + playlistLength) %
                playlistLength;

            const targetVideo = state.dialogPlaylist[targetIndex];
            if (!targetVideo) {
                return;
            }

            openVideoDialog(targetVideo, { preserveCurrentPlaylist: true });
        }

        }

        function startHoldSpeed(event) {
            if (event.button !== undefined && event.button !== 0) {
                return;
            }
            if (holdSpeedState.active) {
                return;
            }
            if (shouldIgnoreHoldTarget(event.target)) {
                return;
            }

            holdSpeedState.active = true;
            holdSpeedState.pointerId =
                event.pointerId !== undefined ? event.pointerId : null;
            holdSpeedState.previousRate = getCurrentPlaybackRate();
            holdSpeedState.wasPausedBeforeHold = isPlayerPaused();
            const holdSpeedTarget = holdSpeedState.previousRate >= 2 ? 3 : 2;
            setHoldSpeedIndicatorRate(holdSpeedTarget);
            setPlaybackRate(holdSpeedTarget);
            setHoldSpeedIndicatorVisible(true);

            if (holdSpeedState.wasPausedBeforeHold) {
                const playPromise = playPlayer();
                if (playPromise && typeof playPromise.catch === "function") {
                    playPromise.catch(() => {});
                }
            }

            if (
                holdSpeedState.pointerId !== null &&
                typeof dialogPlayerEl.setPointerCapture === "function"
            ) {
                try {
                    dialogPlayerEl.setPointerCapture(holdSpeedState.pointerId);
                } catch (_) {
                    // Ignore if pointer capture is not available for this interaction.
                }
            }
        }

        function stopHoldSpeed(event) {
            if (!holdSpeedState.active) {
                return;
            }

            if (
                event &&
                event.pointerId !== undefined &&
                holdSpeedState.pointerId !== null &&
                event.pointerId !== holdSpeedState.pointerId
            ) {
                return;
            }

            setPlaybackRate(holdSpeedState.previousRate || 1);
            setHoldSpeedIndicatorVisible(false);

            if (holdSpeedState.wasPausedBeforeHold) {
                pausePlayer();
            }

            if (
                holdSpeedState.pointerId !== null &&
                typeof dialogPlayerEl.releasePointerCapture === "function"
            ) {
                try {
                    dialogPlayerEl.releasePointerCapture(holdSpeedState.pointerId);
                } catch (_) {
                    // Ignore if pointer capture was already released.
                }
            }

            holdSpeedState.active = false;
            holdSpeedState.pointerId = null;
            holdSpeedState.wasPausedBeforeHold = false;
        }

        function seekActivePlayerBy(seconds) {
            const player = getActivePlayerTimeAndDuration();
            const duration = Number.isFinite(player.duration) ? player.duration : 0;
            const target = Math.max(0, Math.min(player.currentTime + seconds, duration || Number.MAX_SAFE_INTEGER));
            player.setTime(target);
            showSeekToast(seconds > 0 ? `+${seconds}s` : `${seconds}s`);
        }

        function gestureSideFromClientX(clientX) {
            const rect = playerShellEl.getBoundingClientRect();
            if (!rect.width) {
                return "";
            }
            const localX = clientX - rect.left;
            if (localX < rect.width * 0.35) {
                return "left";
            }
            if (localX > rect.width * 0.65) {
                return "right";
            }
            return "";
        }

        playerShellEl.addEventListener("dblclick", (event) => {
            if (shouldIgnoreHoldTarget(event.target)) {
                return;
            }
            event.preventDefault();
            event.stopPropagation();
            const side = gestureSideFromClientX(event.clientX);
            if (side === "left") {
                seekActivePlayerBy(-10);
            }
            if (side === "right") {
                seekActivePlayerBy(10);
            }
        }, true);

        playerShellEl.addEventListener(
            "touchend",
            (event) => {
                if (shouldIgnoreHoldTarget(event.target)) {
                    return;
                }
                if (!event.changedTouches || !event.changedTouches.length) {
                    return;
                }
                const touch = event.changedTouches[0];
                const side = gestureSideFromClientX(touch.clientX);
                if (!side) {
                    gestureState.lastTapAt = 0;
                    gestureState.lastSide = "";
                    return;
                }

                const now = Date.now();
                const isDoubleTap =
                    gestureState.lastSide === side &&
                    now - gestureState.lastTapAt <= 320;

                if (isDoubleTap) {
                    event.preventDefault();
                    seekActivePlayerBy(side === "left" ? -10 : 10);
                    gestureState.lastTapAt = 0;
                    gestureState.lastSide = "";
                    return;
                }

                gestureState.lastTapAt = now;
                gestureState.lastSide = side;
            },
            { passive: false }
        );

        playerShellEl.addEventListener("pointerdown", startHoldSpeed, true);
        playerShellEl.addEventListener("pointerup", stopHoldSpeed, true);
        playerShellEl.addEventListener("pointercancel", stopHoldSpeed, true);
